 <header class="top">

<script>
/* aggiornamento automatico: a ogni apertura (e quando torni sull'app) controlla se c'è una versione nuova e la carica da sola */
if("serviceWorker" in navigator&&location.protocol==="https:"){
 const had=!!navigator.serviceWorker.controller;let ricaricato=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||ricaricato)return;ricaricato=true;
  if(document.getElementById("mod").style.display==="flex")return;location.reload()});
 navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{const ck=()=>r.update().catch(()=>{});ck();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)ck()});addEventListener("online",ck)}).catch(()=>{});
}
</script>
